<!DOCTYPE html>
<!--
  anim.template.html — 信息卡竖版画面模板（暖纸风）

  核心机制：本文件是 ?t= 的纯函数 —— 同一个 t 永远渲染出同一帧。
  render_frames.py 按 fps×duration 逐帧以 ?t=秒数 截图；retime.py 会把
  实测口播切点写回 <script> 里的 cuts 数组（只需保证 id=cuts 存在）。

  场景结构：
    .scene  = 一个场景（对应 cuts 里相邻两个切点之间的时间段）
    .a      = 场景内依次入场的元素，data-d = 相对场景切入点的延迟秒数
    .card/.cardc/.stat/.badge/.shot = 现成卡片样式（信息卡/强调卡/数字卡/徽章/截图）
    cnt(a,b,t0,t1) = 数字滚动：元素 textContent 从 a 滚到 b

  使用：复制本文件为 anim.html，改掉 {{BRAND}} 和场景内容，删掉多余场景，
  让 .scene 的数量 = cuts 数组长度 - 1。

  v1.0.6 新增（anatomy 家族调研 P2 项落地）：
  - 自适应运动模糊：元素入场/场景淡出时按进度自动加 blur，硬切变柔和过渡，无需手工配置
  - 多比例：尺寸抽成 :root 的 --vw/--vh 两个变量，改横版只动这两处 + config.json 的 width/height

  v1.1.0 新增（动画叙事引擎——anatomy 调研动画层 4 条全量落地 + 卡兹克叙事节奏）
  ======================================================
  【入场动作词汇表】.a 元素加 data-motion：
    up（默认，上移淡入）/ left / right（横移入场）
    pop（弹性过冲，大数字/钩子砸场）/ zoom（0.6→1 放大，重磅结论用）
  【转场词汇表】.scene 加 data-trans：
    fade（默认交叉淡出）/ slide（旧幕上滑退场）
    whip（横向甩镜+重模糊，节奏强切）/ zoom（推近转场，「放大看证据」用）
  【Ken Burns】.shot 内 img 自动缓慢推近（scale 1→1.08），静态截图有呼吸感；不用则 data-kb="0"
  【证据强调】SVG 红框随口播画线：dl('框id', t0, t1)——念到哪行画到哪行
  【条形生长】grow('条id', 目标高%, t0, t1)——数据对比幕用
  【CTA 脉冲】pulse('徽章id')——呼吸感提醒，sin 纯函数确定性
  【叙事铁律】分镜先行：写 anim.html 前先出分镜表（每幕：口播要点/画面/动画重点/强调时机）
-->
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* 尺寸：竖版 1080×1920；改横版 16:9 → --vw:1920px;--vh:1080px，同时 config.json 改 width/height，
   布局把 flex 纵排改两栏（左右分栏），字号降一档（64→52 级） */
:root{--vw:1080px;--vh:1920px}
body{width:var(--vw);height:var(--vh);background:#FAF7F2;
 color:#2A2622;font-family:'Microsoft YaHei','PingFang SC',sans-serif;overflow:hidden;position:relative}
.tag{position:absolute;top:96px;left:72px;font-size:34px;letter-spacing:6px;color:#C96442;font-weight:600}
.foot{position:absolute;bottom:200px;left:0;right:0;text-align:center;font-size:26px;color:#A8A29A;letter-spacing:3px;opacity:.6}
.cyan{color:#C96442}.blue{color:#5E6E8C}.amber{color:#A16207}.red{color:#C2410C}.green{color:#15803D}
.mono{font-family:Consolas,Menlo,monospace}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 72px 120px;opacity:0}
.card{background:rgba(94,110,140,.07);border:2px solid #E3DCCE;border-radius:24px;padding:42px 44px;margin-top:28px}
.cardc{background:rgba(201,100,66,.07);border:2px solid #C96442;border-radius:24px;padding:42px 44px;margin-top:28px}
.a{opacity:0;will-change:transform,opacity,filter}
.shot img{transform-origin:center;will-change:transform}
#pbar{position:absolute;top:0;left:0;height:10px;background:#C96442;border-radius:0 6px 6px 0;width:0}
.badge{display:inline-block;background:#C96442;color:#FFF7F0;border-radius:18px;padding:18px 40px;font-size:42px;font-weight:800;align-self:flex-start}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:28px}
.stat{background:rgba(94,110,140,.07);border:2px solid #E3DCCE;border-radius:24px;padding:38px 20px;text-align:center}
.shot{border:3px solid #E3DCCE;border-radius:20px;overflow:hidden;margin-top:28px;background:#fff}
.shot img{width:100%;display:block}
.date{display:inline-block;background:rgba(42,38,34,.08);color:#5E6E8C;border-radius:14px;padding:10px 26px;font-size:34px;font-weight:700}
.num{display:inline-block;width:52px;height:52px;line-height:52px;text-align:center;border-radius:50%;
 background:#C96442;color:#FFF7F0;font-size:30px;font-weight:800;margin-right:16px;vertical-align:middle}
</style>
</head>
<body>
<div id="pbar"></div>
<div class="tag">{{BRAND}}</div>

<!-- 场景 1 · 钩子：pop 砸场 + zoom 转场进实锤 -->
<div class="scene" id="s0" data-trans="zoom">
  <div class="a" data-d="-0.12" data-motion="pop" style="font-size:64px;font-weight:800;line-height:1.5">钩子标题：<span class="cyan">一行说清冲突</span></div>
  <div class="a" data-d="0.5" data-motion="zoom"><div class="cardc" style="font-size:40px">一句话补充<br>把「为什么值得看」讲透</div></div>
</div>

<!-- 场景 2 · 论据：whip 甩镜进数字网格，标题左移入场 -->
<div class="scene" id="s1" data-trans="whip">
  <div class="a" data-d="-0.12" data-motion="left" style="font-size:56px;font-weight:800">先算一笔账</div>
  <div class="a" data-d="0.4"><div class="grid">
    <div class="stat"><div style="font-size:56px;font-weight:900" class="cyan"><span id="num1">0</span></div><div style="font-size:26px;color:#5E6E8C;margin-top:8px">指标一</div></div>
    <div class="stat"><div style="font-size:56px;font-weight:900"><span id="num2">0</span></div><div style="font-size:26px;color:#5E6E8C;margin-top:8px">指标二</div></div>
    <div class="stat"><div style="font-size:56px;font-weight:900" class="green"><span id="num3">0</span></div><div style="font-size:26px;color:#5E6E8C;margin-top:8px">指标三</div></div>
    <div class="stat"><div style="font-size:56px;font-weight:900" class="red"><span id="num4">0</span></div><div style="font-size:26px;color:#5E6E8C;margin-top:8px">指标四</div></div>
  </div></div>
</div>

<!-- 场景 3 · 步骤：slide 退场接编号列表，右侧横移入场 -->
<div class="scene" id="s2" data-trans="slide">
  <div class="a" data-d="-0.12" style="font-size:56px;font-weight:800;margin-bottom:30px">怎么做到的</div>
  <div class="a" data-d="0.3" data-motion="right"><div class="card" style="font-size:38px"><span class="num">1</span>第一步，一句话说清</div></div>
  <div class="a" data-d="0.9" data-motion="right"><div class="card" style="font-size:38px"><span class="num">2</span>第二步，一句话说清</div></div>
  <div class="a" data-d="1.5" data-motion="right"><div class="card" style="font-size:38px"><span class="num">3</span>第三步，一句话说清</div></div>
</div>

<!-- 场景 4 · 收尾：CTA 徽章脉冲（pulse） -->
<div class="scene" id="s3">
  <div class="a" data-d="-0.12" data-motion="pop" style="font-size:64px;font-weight:800;line-height:1.5">完整配置<br>在<span class="cyan">评论区</span>直接抄</div>
  <div class="a badge" id="cta-badge" data-d="0.45" style="margin-top:52px">关注我 · 下一条实测更新</div>
  <div class="a" data-d="0.8" style="margin-top:36px;font-size:40px;color:#6B655C">一个互动问题<br>评论区报个数 👇</div>
</div>

<div class="foot">{{BRAND}}</div>
<script>
const qs=new URLSearchParams(location.search);
const t=parseFloat(qs.get('t')||'0');
const scenes=[...document.querySelectorAll('.scene')];
/* cuts 由 retime.py 按实测口播时长自动重写；初始值按 config.duration 均分占位 */
const cuts=[0,11,22,33,45];
let si=0;for(let k=0;k<cuts.length-1;k++){if(t>=cuts[k]&&t<cuts[k+1]){si=k;break}}
document.getElementById('pbar').style.width=(t/cuts[cuts.length-1]*100).toFixed(2)+'%';
function ease3(p){return 1-Math.pow(1-p,3)}
/* 弹性过冲：pop 入场用（纯函数） */
function easeBack(p){const c=1.70158*1.2;const x=p-1;return 1+(c+1)*x*x*x+c*x*x}

/* ============ v1.1.0 动画叙事引擎（全部 ?t= 纯函数，同 t 同帧） ============ */

/* 入场动作词汇表：按 data-motion 分派 */
function applyMotion(el,e,motion){
  let tr;
  switch(motion){
    case 'left':  tr=`translateX(${((1-e)*-72).toFixed(1)}px)`;break;
    case 'right': tr=`translateX(${((1-e)*72).toFixed(1)}px)`;break;
    case 'pop':{  const s=Math.max(.01,easeBack(e));tr=`scale(${s.toFixed(3)})`;break}
    case 'zoom':  tr=`scale(${(0.6+0.4*e).toFixed(3)})`;break;
    default:      tr=`translateY(${((1-e)*44).toFixed(1)}px)`;
  }
  el.style.transform=tr;
  el.style.filter=(motion==='pop'||motion==='zoom')?'':(e<1?`blur(${((1-e)*1.4).toFixed(2)}px)`:'');
}

/* 转场词汇表：当前幕/退场幕各自 data-trans */
function sceneTrans(s,k,si,t,cutsArr){
  const T=(s.dataset.trans||'fade');
  const dp=Math.min(Math.max((t-cutsArr[si])/0.4,0),1); // 新幕进入进度
  const lp=1-Math.min(Math.max((t-cutsArr[si])/0.35,0),1); // 旧幕淡出剩余
  if(k===si){
    let tr='';
    if(T==='slide')  tr=`translateY(${((1-dp)*-120).toFixed(1)}px)`;
    if(T==='whip')   tr=`translateX(${((1-ease3(dp))*640).toFixed(0)}px)`;
    if(T==='zoom')   tr=`scale(${(1.35-0.35*ease3(dp)).toFixed(3)})`;
    s.style.transform=tr;
    s.style.opacity=T==='fade'?1:dp.toFixed(3);
    s.style.filter=(T==='whip'&&dp<1)?`blur(${((1-dp)*7).toFixed(1)}px)`:'';
  }else if(k===si-1&&si>0){
    const T0=scenes[k].dataset.trans||'fade';
    let tr='';
    if(T0==='slide') tr=`translateY(${((1-lp)*-160).toFixed(1)}px)`;
    if(T0==='whip')  tr=`translateX(${((1-lp)*-560).toFixed(0)}px)`;
    if(T0==='zoom')  tr=`scale(${(1+0.3*(1-lp)).toFixed(3)})`;
    scenes[k].style.transform=tr;
    scenes[k].style.opacity=lp.toFixed(3);
    scenes[k].style.filter=(T0==='whip'&&lp>0)?`blur(${((1-lp)*7).toFixed(1)}px)`:((lp<1&&lp>0)?`blur(${((1-lp)*1.6).toFixed(2)}px)`:'');
  }
}

scenes.forEach((s,k)=>{
  let op=0;
  if(k===si)op=1;
  else if(k===si-1&&si>0)op=Math.max(0,1-(t-cuts[si])/0.35);
  if(k!==si&&!(k===si-1&&si>0)){s.style.opacity='0';s.style.transform=''}
  else sceneTrans(s,k,si,t,cuts);
  if(k===si){
    s.querySelectorAll('.a').forEach(el=>{
      const d=parseFloat(el.dataset.d||'0');
      const p=Math.min(Math.max((t-cuts[si]-d)/0.5,0),1);
      const e=(el.dataset.motion==='pop')?easeBack(p):ease3(p);
      const eClamped=Math.min(Math.max(e,0),1.05);
      el.style.opacity=(el.dataset.motion==='pop'?Math.min(p*1.6,1):ease3(p)).toFixed(3);
      applyMotion(el,Math.min(Math.max(p,0),1),el.dataset.motion||'up');
    });
    /* Ken Burns：截图缓慢推近，整幕生命周期内线性 */
    const span=cuts[si+1]-cuts[si];
    const kb=Math.min(Math.max((t-cuts[si])/Math.max(span,0.1),0),1);
    s.querySelectorAll('.shot img').forEach(img=>{
      if(img.dataset.kb==='0')return;
      img.style.transform=`scale(${(1+0.08*kb).toFixed(4)})`;
    });
  }
});

/* 证据强调：SVG 红框画线。dl('框id', t0, t1)：t0 到 t1 期间 stroke-dashoffset 从满到 0 */
function dl(id,t0,t1){const el=document.getElementById(id);if(!el)return;
  const len=el.getTotalLength?el.getTotalLength():1200;
  const p=Math.min(Math.max((t-t0)/(t1-t0),0),1);
  el.style.strokeDasharray=len;el.style.strokeDashoffset=(len*(1-ease3(p))).toFixed(1);
  el.style.opacity=p>0?1:0;}
/* 条形生长：grow('条id', 目标高%, t0, t1) */
function grow(id,hPct,t0,t1){const el=document.getElementById(id);if(!el)return;
  const p=Math.min(Math.max((t-t0)/(t1-t0),0),1);
  el.style.height=(hPct*ease3(p)).toFixed(1)+'%';}
/* CTA 脉冲：呼吸缩放，sin 纯函数 */
function pulse(id){const el=document.getElementById(id);if(!el)return;
  const s=1+0.045*Math.sin(Math.max(t-1,0)*4.2);el.style.transform+=` scale(${s.toFixed(4)})`;}
/* 数字滚动：cnt(起始值, 终值, 开始秒, 结束秒)。t0/t1 相对全局时间，可用 cuts[i]+偏移 */
function cnt(a,b,t0,t1){const p=Math.min(Math.max((t-t0)/(t1-t0),0),1);const e=1-Math.pow(1-p,2);return a+(b-a)*e}
/* 示例：场景 2 切入后 1.6s 起，四个数字依次滚动到目标值（改成你的真实数据） */
const targets={num1:100,num2:1000,num3:500,num4:6500};
Object.keys(targets).forEach((id,i)=>{
  const el=document.getElementById(id);
  if(el)el.textContent=Math.round(cnt(0,targets[id],cuts[1]+1.0+i*0.5,cuts[1]+3.6+i*0.5)).toLocaleString();
});
/* v1.1.0 示例：证据幕红框画线（念到哪行画到哪行）与 CTA 脉冲 */
dl('evid-box',cuts[1]+2.0,cuts[1]+3.2);
pulse('cta-badge');
</script>
</body>
</html>
